# ─────────────────────────────────────────────────────────────────────────────
# CrimeAI — Render.com deployment blueprint
# Deploy all backend services from one file
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── FastAPI Web Service ─────────────────────────────────────────────────────
  - type: web
    name: crimeai-api
    runtime: python
    rootDir: crimeai/backend
    buildCommand: |
      pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm
    startCommand: |
      alembic upgrade head &&
      celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=1 &
      celery -A app.workers.celery_app:celery_app beat --loglevel=info &
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # Set manually to your Supabase URL
      - key: DATABASE_URL_SYNC
        sync: false   # Set manually to your Supabase URL (same as above but change postgresql:// to postgresql+psycopg2://)
      - key: REDIS_URL
        sync: false   # Set manually from Upstash
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: DOCS_ENABLED
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your Vercel frontend URL
    healthCheckPath: /health
    autoDeploy: true
