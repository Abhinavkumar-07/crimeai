[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "RUF"]
ignore = ["E501", "B008", "RUF012"]
exclude = ["alembic/versions/"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
env = [
    "APP_ENV=test",
    "DATABASE_URL=postgresql+asyncpg://crimeai:crimeai_dev_password@localhost:5432/crimeai_test",
    "DATABASE_URL_SYNC=postgresql://crimeai:crimeai_dev_password@localhost:5432/crimeai_test",
    "REDIS_URL=redis://localhost:6379/15",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/base.py", "alembic/*", "tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
