services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    container_name: crimeai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crimeai
      POSTGRES_PASSWORD: crimeai_dev_password
      POSTGRES_DB: crimeai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init_extensions.sql:/docker-entrypoint-initdb.d/01_init_extensions.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crimeai -d crimeai" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: crimeai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimeai_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://crimeai:crimeai_dev_password@db:5432/crimeai
      DATABASE_URL_SYNC: postgresql://crimeai:crimeai_dev_password@db:5432/crimeai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_ENV: development
      APP_DEBUG: "true"
      DOCS_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: crimeai_worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://crimeai:crimeai_dev_password@db:5432/crimeai
      DATABASE_URL_SYNC: postgresql://crimeai:crimeai_dev_password@db:5432/crimeai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_ENV: development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: crimeai_beat
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://crimeai:crimeai_dev_password@db:5432/crimeai
      DATABASE_URL_SYNC: postgresql://crimeai:crimeai_dev_password@db:5432/crimeai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_ENV: development
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=info
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: crimeai_network
